# Config A: Perceiver-resampled conditioning.
#
# The adapted latent tokens are compressed to a fixed bank of `num_queries`
# tokens before the DiT ever sees them, so cross-attention cost and capacity are
# identical whether the world model emits 256 tokens or 1024. That is what makes
# a cross-model panel a controlled comparison; the price is an information
# bottleneck, which configB-direct.yaml exists to check against.
#
# The SAME file trains a decoder for ANY world model. Only the shard set changes:
#
#   python -m app.flow_decoder.train --config configs/train/flow_decoder/configA-perceiver.yaml \
#       --override data.train_shards=data/flow_decoder_shards/<model>/train \
#       --override data.eval_shards=data/flow_decoder_shards/<model>/eval \
#       --override folder=preliminary_experiments/flow-decoder/<model>-configA
#
# d_m, the token grid and the normalization buffers are read from the shard
# manifest. Nothing else may differ between world models - that is a spec
# prohibition, and evals/generate_flow_decoder_panels.py enforces it by comparing
# the saved model_config of every checkpoint it loads.
app: flow_decoder
folder: preliminary_experiments/flow-decoder/vjepa2-baseline-configA

data:
  train_shards: data/flow_decoder_shards/vjepa2-baseline/train
  eval_shards: data/flow_decoder_shards/vjepa2-baseline/eval
  # target_encoder = the world model's representation of the real next frame,
  # i.e. its latent space. `predictor` decodes the world model's own prediction
  # instead; both are cached, and which one is decoded is a global choice.
  latent_source: target_encoder
  batch_size: 8
  num_workers: 4

codec:
  # Frozen. Never trained or fine-tuned (spec prohibition).
  kind: kl
  model_id: stabilityai/sd-vae-ft-mse
  downsample_factor: 8

model:
  conditioning: perceiver
  # `none` = reconstruct from the latent tokens alone; the decoder never sees the
  # preceding frame, so whatever appears in a sample came from the latent. This is
  # the setting the deliverable is about. `current_frame` also feeds x_t, which
  # makes the task much easier and the measurement much weaker.
  frame_conditioning: none
  patch_size: 2
  dim: 768
  depth: 12
  num_heads: 12
  cond_dim: 768
  mlp_ratio: 4.0
  num_queries: 128
  resampler_depth: 2
  resampler_heads: 8
  latent_norm_mode: channel
  num_coord_bands: 8
  use_activation_checkpointing: true

flow:
  timestep_mode: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  latent_dropout: 0.1
  sigma_max: 0.5
  sigma_prob: 0.5

optimization:
  # FIXED budget, shared by every run in a comparison. Do not shorten one run
  # because its eval loss flattened - there is no early stopping.
  steps: 60000
  grad_accum: 2
  lr: 0.0001
  start_lr: 0.000001
  final_lr: 0.00001
  warmup: 1000
  weight_decay: 0.0
  betas: [0.9, 0.95]
  clip_grad: 1.0
  ema_decay: 0.9999

meta:
  seed: 0
  dtype: bfloat16
  log_freq: 100
  eval_freq: 2000
  eval_batches: 16
  save_freq: 2000
  sample_freq: 5000
  sample_steps: 24
  sample_guidance: 1.5
